# Tooling configuration only (no build metadata): the service is installed
# from requirements*.txt.  Ruff runs from the repository root or from here:
#   ..\.venv\Scripts\python.exe -m ruff check app tests
[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
# Error-level rules plus unused import / redefinition / unused variable.
# Style rules (E1-E7, I, B, UP) are deliberately not enabled yet.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
# Star-import support modules re-export names for the focused test modules.
"**/tests/provider_test_support.py" = ["F401", "F811"]
"**/tests/async_database_test_support.py" = ["F401", "F811"]
