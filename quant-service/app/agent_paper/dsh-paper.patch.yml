# The paper trader supplies its complete bounded context through AGENTS.md, which
# dsh-agent-instructions injects before the first model request.  No coding tool
# is useful here; hiding their schemas also prevents exploratory tool/subagent
# turns from multiplying the decision's token and latency cost.
- id: system-prompt
  config:
    personaPrefix: You make one A-share paper-trading decision from the supplied context.
    personaSuffix: ''

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
