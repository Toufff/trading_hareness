name: Release edge images

on:
  push:
    tags:
      - 'edge-*'
  workflow_dispatch:
    inputs:
      release:
        description: Release label written into image provenance
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      RELEASE: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        id: build
        run: echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish quant edge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: quant-service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/trading-hareness-quant:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/trading-hareness-quant:${{ env.RELEASE }}
          provenance: false
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ env.RELEASE }}
            APP_BUILD_CREATED_AT=${{ steps.build.outputs.created_at }}
      - name: Publish Feishu relay adapter image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: feishu-adapter/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/trading-hareness-feishu-adapter:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/trading-hareness-feishu-adapter:${{ env.RELEASE }}
          provenance: false
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ env.RELEASE }}
            APP_BUILD_CREATED_AT=${{ steps.build.outputs.created_at }}
