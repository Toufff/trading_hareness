name: Release edge images

on:
  push:
    tags:
      - 'edge-*'
  workflow_dispatch:
    inputs:
      release:
        description: Release label written into image provenance
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      RELEASE: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build time
        id: build
        run: echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish quant edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quant-service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/trading-hareness-quant:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/trading-hareness-quant:${{ env.RELEASE }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ env.RELEASE }}
            APP_BUILD_CREATED_AT=${{ steps.build.outputs.created_at }}
      - name: Publish Feishu relay adapter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: feishu-adapter/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/trading-hareness-feishu-adapter:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/trading-hareness-feishu-adapter:${{ env.RELEASE }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
            APP_RELEASE=${{ env.RELEASE }}
            APP_BUILD_CREATED_AT=${{ steps.build.outputs.created_at }}
