name: Verify platform contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      QUANT_WRITE_API_KEY: ci-quant-write-key
      N8N_ENCRYPTION_KEY: ci-n8n-encryption-key
      # compose.yaml marks these as required for the feishu-adapter service;
      # CI never talks to Feishu, the values only satisfy interpolation.
      FEISHU_APP_ID: ci-feishu-app-id
      FEISHU_APP_SECRET: ci-feishu-app-secret
      QUANT_BACKGROUND_TASKS_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint research service (ruff)
        working-directory: quant-service
        run: |
          python -m pip install --quiet ruff==0.16.5
          # Config lives in quant-service/pyproject.toml.  tests/, the
          # top-level service scripts and app/ (clean as of WP9b) block;
          # ../scripts/ still carries pre-existing findings and only warns.
          ruff check tests ./*.py
          ruff check app
          ruff check ../scripts/*.py \
            || echo "::warning::ruff findings in scripts/ (non-blocking until cleaned up)"

      - name: Verify architecture contracts
        run: python3 scripts/verify_architecture.py

      - name: Install and verify dashboard
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          npm run build --prefix frontend

      - name: Build research service and initialize an empty database
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres
          docker compose build quant-research feishu-adapter
          # The quant baseline requires the adapter's ingestion ledger first.
          # initialize-ledger.mjs is now baked into the adapter image, so no
          # bind-mount is required here.
          docker compose run --rm --no-deps feishu-adapter node initialize-ledger.mjs
          # Empty database -> frozen legacy baseline -> stamp 0001 -> alembic upgrade head.
          # database_bootstrap.py is now baked into the research image, so no
          # bind-mount is required here.
          docker compose run --rm --no-deps quant-research python database_bootstrap.py

      - name: Migration smoke (upgrade head -> downgrade -1 -> upgrade head)
        run: |
          docker compose run --rm --no-deps quant-research python -m alembic -c alembic.ini upgrade head
          docker compose run --rm --no-deps quant-research python -m alembic -c alembic.ini downgrade -1
          docker compose run --rm --no-deps quant-research python -m alembic -c alembic.ini upgrade head
          docker compose run --rm --no-deps quant-research python -m alembic -c alembic.ini current

      - name: Test research service
        run: |
          docker compose run --rm --no-deps quant-research python -m unittest discover -s tests -q

      - name: Verify mounted API contract and generated types
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres quant-research
          node scripts/verify-api-contract.mjs
          npm run api:check --prefix frontend

      - name: Build and test Feishu adapter
        run: |
          docker build --tag n8n-feishu-adapter:test --file feishu-adapter/Dockerfile .
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/feishu-adapter:/tests:ro" \
            n8n-feishu-adapter:test \
            sh -lc 'cp /tests/*.test.mjs /app/ && node --test *.test.mjs'

      - name: Verify whitespace
        run: git diff --check

      - name: Clean CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  pwsh-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run PowerShell script tests
        shell: pwsh
        run: |
          $failures = 0
          Get-ChildItem -LiteralPath 'scripts/windows/tests' -Filter 'test-*.ps1' | ForEach-Object {
            Write-Host "== $($_.Name) =="
            & pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$($_.Name) failed with exit code $LASTEXITCODE"
              $failures++
            }
          }
          if ($failures -gt 0) { throw "$failures PowerShell test file(s) failed" }

  peer-compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate shared-peer compose config
        working-directory: deploy/shared-peer
        env:
          # Dummy values only: this job never starts the peer stack, it only
          # exercises docker compose's own variable interpolation/schema
          # validation for every required (":?") variable in compose.yaml.
          PEER_SSH_HOST: ci-peer-host
          PEER_SSH_KEY_PATH: ./compose.yaml
          PEER_KNOWN_HOSTS_PATH: ./compose.yaml
          PEER_WHEELHOUSE_PATH: ./
          PEER_DB_PASSWORD: ci-peer-db-password
          PEER_QUANT_WRITE_API_KEY: ci-peer-quant-write-key
          QUANT_SHARED_READ_API_KEY: ci-shared-read-key
          PEER_N8N_ENCRYPTION_KEY: ci-peer-n8n-encryption-key
        run: docker compose -f compose.yaml --profile n8n config --quiet
