<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模拟盘对照复盘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#1c1e21;--mute:#6b7280;--line:#e5e7eb;--soft:#f1f3f6;--accent:#2563eb;
  --up:#d92d20;--down:#15803d;--warn:#b45309;--warn-bg:#fef3c7;--ok-bg:#e8f5ec;--bad-bg:#fdecea;--info-bg:#e8effd;--code:#f4f5f7;
  --me:#7c3aed;--me-bg:#f1e9fe;--a1:#2563eb;--a1-bg:#e8effd;--a2:#0f766e;--a2-bg:#e3f5f2;--a3:#c2410c;--a3-bg:#ffedd5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--panel:#171a21;--fg:#e6e8eb;--mute:#9aa3ae;--line:#2a2f38;
  --soft:#1e222a;--accent:#6ea0ff;--up:#ff6b5e;--down:#4ade80;--warn:#fbbf24;--warn-bg:#3a2f12;--ok-bg:#15291c;--bad-bg:#3a1a18;--info-bg:#18233a;--code:#12151b;
  --me:#c4b5fd;--me-bg:#2a2140;--a1:#8ab4ff;--a1-bg:#16233c;--a2:#5eead4;--a2-bg:#10302c;--a3:#fdba74;--a3-bg:#3b2415}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
select,button{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled),select:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--mute)}.small{font-size:12px}.nowrap{white-space:nowrap}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card.me{border-left:3px solid var(--me)}.card.a1{border-left:3px solid var(--a1)}.card.a2{border-left:3px solid var(--a2)}.card.a3{border-left:3px solid var(--a3)}
.card h3{margin:0 0 2px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25}
.pos{color:var(--up)}.neg{color:var(--down)}
.spark{display:block;margin-top:6px;width:100%;height:34px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--panel)}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel);color:var(--mute);font-weight:500;font-size:12px}
tbody tr:hover{background:var(--soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.panel>h2{font-size:14px;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
.who{display:inline-block;font-size:12px;border-radius:6px;padding:0 7px;line-height:20px;font-weight:600;white-space:nowrap}
.who.me{background:var(--me-bg);color:var(--me)}.who.a1{background:var(--a1-bg);color:var(--a1)}.who.a2{background:var(--a2-bg);color:var(--a2)}.who.a3{background:var(--a3-bg);color:var(--a3)}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--down)}.b-bad{background:var(--bad-bg);color:var(--up)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--accent)}
.side-buy{color:var(--up);font-weight:600}.side-sell{color:var(--down);font-weight:600}
.why{white-space:pre-wrap;word-break:break-word;color:var(--fg)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.clamp.open{-webkit-line-clamp:unset;display:block}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--info-bg)}
.round{border-bottom:1px solid var(--line);padding:9px 12px}
.round:last-child{border-bottom:0}
.rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rhead .t{font-weight:650;font-variant-numeric:tabular-nums}
.order{border-left:3px solid var(--line);padding:5px 9px;margin:6px 0;background:var(--soft);border-radius:0 7px 7px 0}
.order.buy{border-left-color:var(--up)}.order.sell{border-left-color:var(--down)}.order.cancel{border-left-color:var(--warn)}
.order .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
details.more{margin-top:5px}details.more>summary{cursor:pointer;color:var(--mute);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;background:var(--info-bg);color:var(--accent);border-radius:6px;padding:1px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:2px 8px}
.empty{color:var(--mute);padding:12px}
.noteform{display:grid;gap:4px;margin-top:8px}
.noteform textarea{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px;resize:vertical;width:100%}
.noteform textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.noterow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:2px}
.error{background:var(--bad-bg);color:var(--up);padding:8px 12px;border-radius:8px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
dialog{width:min(1000px,96vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlghead{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dlgbody{padding:10px 14px;overflow:auto;max-height:calc(90vh - 52px)}
.tree{font:12px/1.55 ui-monospace,Consolas,monospace}
.tree details{margin-left:14px}.tree summary{cursor:pointer}
.tree .k{color:var(--accent)}.tree .s{color:var(--warn)}.tree .n{color:var(--down)}
.tree .leaf{margin-left:14px;white-space:pre-wrap;word-break:break-word}
.tx{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:6px 10px}
.tx pre{white-space:pre-wrap;word-break:break-word;background:var(--code);padding:8px;border-radius:6px;margin:6px 0 0;font:12px/1.5 ui-monospace,Consolas,monospace;max-height:420px;overflow:auto}
@media (max-width:640px){.big{font-size:20px}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>模拟盘对照复盘</h1>
  <label class="muted small">交易日 <select id="day"></select></label>
  <button id="refresh">刷新</button>
  <span id="stamp" class="muted small"></span>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-view="lanes" aria-selected="true">时间轴泳道</button>
    <button role="tab" data-view="timeline" aria-selected="false">操作明细</button>
    <button role="tab" data-view="symbols" aria-selected="false">逐笔对照</button>
    <button role="tab" data-view="rounds" aria-selected="false">决策明细</button>
    <button role="tab" data-view="book" aria-selected="false">持仓与净值</button>
  </nav>
</div></header>
<main>
  <div id="error" class="error" hidden></div>
  <section id="score" class="score"></section>
  <section id="view"></section>
</main>
<dialog id="dlg"><div class="dlghead"><strong id="dlgtitle"></strong><button id="dlgclose">关闭</button></div><div id="dlgbody" class="dlgbody"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>v==null||v===''?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const int=v=>v==null?'—':Number(v).toLocaleString('zh-CN');
const pct=v=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%';
const sign=v=>v==null?'':v>0?'pos':v<0?'neg':'';
const hm=s=>s?new Date(s).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—';
const NAMES={'agent-claude-opus':'Claude Sonnet','agent-dsh':'DSH','agent-codex-sol':'Codex GPT-6 Sol'};
const AGENT_CLASSES=['a1','a2','a3'];
const agentClass=i=>AGENT_CLASSES[i%AGENT_CLASSES.length];
const SIDE={buy:'买入',sell:'卖出',cancel:'撤单'};
const STATUS={filled:['成交','b-ok'],partially_filled:['部分成交','b-warn'],open:['挂单中','b-info'],rejected:['被拒','b-bad'],cancelled:['已撤','b-warn'],expired:['收盘未成','b-warn']};
const REASONS={no_live_quote:'无实时行情',not_board_lot:'不是整百股',limit_not_marketable:'限价未到可成交价',no_ask_depth:'卖盘无量',no_bid_depth:'买盘无量',no_depth:'盘口无量',
  limit_up_or_no_ask_depth:'涨停或卖盘无量',limit_down_or_no_bid_depth:'跌停或买盘无量',insufficient_cash:'资金不足',insufficient_sellable_quantity:'可卖数量不足',
  t_plus_one_or_insufficient_sellable_quantity:'T+1 或可卖数量不足',invalid_symbol:'代码无效',non_positive_quantity:'数量无效',cancel_unknown_order:'找不到要撤的单',
  limit_price_required:'限价单缺价格',reason_required:'缺少理由',order_not_object:'订单格式错误',unsupported_action:'不支持的操作',unsupported_order_type:'不支持的订单类型'};
const reason=r=>REASONS[r]||REASONS[String(r).split(':')[0]]||r;
const CLS={me:'me'};
let current=null,lastBody='',view='lanes',actorFilter=new Set(),roundAccount=null;

async function api(path){const r=await fetch(path,{cache:'no-store'});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;}

function actors(d){
  const list=[{key:'me',label:'你（实盘）',cls:'me'}];
  d.accounts.forEach((a,i)=>list.push({key:a.account_key,label:NAMES[a.account_key]||a.account_key,cls:agentClass(i),account:a}));
  return list;
}
function whoTag(a){return `<span class="who ${a.cls}">${esc(a.label)}</span>`;}

/* ---------- scoreboard ---------- */
function sparkline(navs){
  const points=(navs||[]).map(n=>Number(n.equity)).filter(Number.isFinite);
  if(points.length<2)return '';
  const min=Math.min(...points),max=Math.max(...points),span=(max-min)||1;
  const step=100/(points.length-1);
  const path=points.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(2)},${(30-(v-min)/span*28).toFixed(2)}`).join(' ');
  const rising=points.at(-1)>=points[0];
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" fill="none"
    stroke="${rising?'var(--up)':'var(--down)'}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}
function scoreboard(d){
  const h=d.human,daily=(d.accounts[0]||{}).daily||{};
  const missing=(daily.human_missing_prices||[]).length;
  const dayReturn=(equity,previous)=>equity!=null&&previous?((equity/previous-1)*100):null;
  const myToday=dayReturn(h?.equity,h?.previous_equity);
  const cards=[`<div class="card me"><h3>你（实盘）<span class="muted small">券商账户</span></h3>
    <div class="big">${h&&h.equity!=null?num(h.equity):'待同步'}</div>
    <div>${h&&h.equity!=null?`<span class="${sign(myToday)}">今日 ${pct(myToday)}</span>
      <span class="muted small">· 累计 <span class="${sign(h.total_return_pct)}">${pct(h.total_return_pct)}</span></span>`:'&nbsp;'}</div>
    <div class="muted small">${h?.comparable?(h.basis==='broker_close_snapshot'?'收盘后券商快照':'快照+成交重建')
      :`收盘同步后可比${daily.human_fills_imported_through?`；成交已导入至 ${esc(daily.human_fills_imported_through)}`:''}${missing?`；缺 ${missing} 只收盘价`:''}`}</div>
    <div class="muted small">今日成交 ${(d.human_trades?.orders||[]).length} 笔 · 复盘记录 ${Object.keys(d.human_trades?.notes||{}).length+(d.human_trades?.journal||[]).length} 条</div>
    <div class="muted small">今日=对比${h?.previous_equity?'前一交易日收盘':'（缺前一日基准）'}；累计=对比 ${esc((d.accounts[0]||{}).start_date||'')} 对照起点</div></div>`];
  for(const [i,a] of d.accounts.entries()){
    const x=a.daily||{},nav=a.navs.at(-1),shownNav=nav||a.latest_nav;
    const started=!a.start_date||d.day>=a.start_date;
    const filled=a.orders.filter(o=>['filled','partially_filled'].includes(o.status)).length;
    const failed=a.decisions.filter(z=>z.status!=='decided').length;
    const total=x.agent_return_pct;
    const today=dayReturn(nav?nav.equity:null,x.previous_agent_equity);
    cards.push(`<div class="card ${agentClass(i)}"><h3>${esc(NAMES[a.account_key]||a.account_key)}<span class="muted small">${esc(a.model)}</span></h3>
      <div class="big">${num(started?(shownNav?shownNav.equity:a.initial_equity):null)}</div>
      <div><span class="${sign(today)}">今日 ${pct(today)}</span>
        <span class="muted small">· 累计 <span class="${sign(total)}">${pct(total)}</span></span></div>
      <div class="muted small">决策 ${a.decisions.length-failed}/${a.decisions.length} 轮${failed?`（失败 ${failed}）`:''} · 成交 ${filled} 笔 · 现金 ${int(started?(shownNav?shownNav.cash:a.cash):null)}</div>
      ${started?(nav?'':a.latest_nav?`<div class="muted small">尚无当日净值，显示 ${esc(a.latest_nav.trading_date)} 最近净值</div>`:'<div class="muted small">尚无盘中净值，当前显示初始权益</div>'):`<div class="muted small">账户于 ${esc(a.start_date)} 启动</div>`}
      ${sparkline(a.navs)}</div>`);
  }
  $('#score').innerHTML=cards.join('');
}

/* ---------- merged timeline ---------- */
function events(d){
  const rows=[];
  const journal=Object.fromEntries((d.human_trades?.journal||[]).map(j=>[j.symbol,j]));
  const notes=d.human_trades?.notes||{};
  for(const o of d.human_trades?.orders||[]){
    const note=notes[o.order_number]||{},fallback=journal[o.symbol];
    rows.push({at:`${d.day}T${o.first_fill_time}+08:00`,actor:'me',side:o.side,symbol:o.symbol,name:o.name,
      quantity:o.quantity,price:o.avg_price,status:'filled',order_number:o.order_number,
      note:o.fills>1?`分 ${o.fills} 笔成交`+(o.order_time?` · 委托 ${o.order_time}`:''):(o.order_time?`委托 ${o.order_time}`:''),
      why:note.body||(fallback?fallback.body:''),plan:note.plan||(fallback&&(fallback.plans||[])[0]?fallback.plans[0].plan:''),
      saved_at:note.saved_at||null,editable:Boolean(o.order_number)});
  }
  for(const a of d.accounts){
    const byId=Object.fromEntries(a.decisions.flatMap(z=>(z.ledger_orders||[]).map(o=>[o.order_id,z])));
    for(const o of a.orders){
      const z=byId[o.order_id];
      rows.push({at:o.placed_at,actor:a.account_key,side:o.side,symbol:o.symbol,name:o.name,quantity:o.quantity,
        price:o.fill_price??o.limit_price,status:o.status,
        note:[o.order_type==='limit'?`限价 ${num(o.limit_price)}`:'市价',o.filled_quantity?`成交 ${int(o.filled_quantity)} 股`:'',
              (o.reject_reasons||[]).map(reason).join('、')].filter(Boolean).join(' · '),
        why:o.reason,round:z?hm(z.decided_at):''});
    }
    for(const z of a.decisions){
      for(const o of z.outcomes||[]){
        if(o.order_id)continue;
        const raw=o.order||{};
        rows.push({at:z.decided_at,actor:a.account_key,side:raw.action,symbol:raw.symbol,name:'',quantity:raw.quantity,
          price:raw.limit_price,status:o.status==='cancelled'?'cancelled':'rejected',
          note:'下单前被规则拒绝 · '+(o.reasons||[]).map(reason).join('、'),why:raw.reason});
      }
    }
  }
  return rows.sort((x,y)=>String(y.at).localeCompare(String(x.at)));
}
function timelineView(d){
  const all=actors(d);
  const chips=[`<button data-actor="all" aria-pressed="${actorFilter.size===0}">全部</button>`,
    ...all.map(a=>`<button data-actor="${esc(a.key)}" aria-pressed="${actorFilter.has(a.key)}">只看${esc(a.label)}</button>`)].join('');
  const rows=events(d).filter(e=>actorFilter.size===0||actorFilter.has(e.actor));
  const byKey=Object.fromEntries(all.map(a=>[a.key,a]));
  const body=rows.map((e,i)=>{
    const [label,cls]=STATUS[e.status]||[e.status,'b-info'];
    const a=byKey[e.actor]||{label:e.actor,cls:''};
    return `<tr><td class="nowrap">${hm(e.at)}${e.round&&e.round!==hm(e.at)?`<div class="muted small">轮次 ${e.round}</div>`:''}</td>
      <td class="nowrap">${whoTag(a)}</td>
      <td class="nowrap"><span class="side-${esc(e.side)}">${SIDE[e.side]||esc(e.side)}</span> ${esc(e.name||'')}<div class="muted small">${esc(e.symbol||'')}</div></td>
      <td class="nowrap">${int(e.quantity)} 股<div class="muted small">${e.price!=null?num(e.price,3):'—'}</div></td>
      <td class="nowrap"><span class="badge ${cls}">${label}</span><div class="muted small">${esc(e.note||'')}</div></td>
      <td>${e.why?`<div class="why clamp" data-clamp>${esc(e.why)}</div>`:'<span class="muted small">—</span>'}
        ${e.plan?`<details class="more"><summary>次日计划</summary><div class="why">${esc(e.plan)}</div></details>`:''}</td></tr>`;
  }).join('');
  return `<div class="panel"><h2><span>当日操作时间线（最新在上）</span><span class="filters">${chips}</span></h2>
    <div class="scroll"><table><thead><tr><th>时间</th><th>谁</th><th>操作</th><th>数量 / 价格</th><th>状态</th><th>理由（点击展开）</th></tr></thead>
    <tbody>${body||'<tr><td colspan="6" class="empty">这一天没有操作记录。</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- lane chart: one row per actor on a shared session clock ---------- */
const SESSION=[[9*60+30,11*60+30],[13*60,15*60]];
const SESSION_MINUTES=240;
function sessionMinute(at){
  const local=new Date(at).toLocaleTimeString('en-GB',{timeZone:'Asia/Shanghai',hour12:false});
  const [h,m]=local.split(':').map(Number);
  const minutes=h*60+m;
  let passed=0;
  for(const [from,to] of SESSION){
    if(minutes<from)return passed;
    if(minutes<=to)return passed+(minutes-from);
    passed+=to-from;
  }
  return SESSION_MINUTES;
}
function laneClock(m){
  const minutes=m<120?(9*60+30+m):(13*60+m-120);
  return `${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;
}
let laneEvents=[],laneSelected=null;
function lanesView(d){
  const all=actors(d);
  const rows=events(d).slice().reverse();
  laneEvents=rows;
  const L=96,R=22,W=1000,LANE=84,TOP=34,PAD=12;
  const H=TOP+all.length*LANE+28;
  const x=m=>L+PAD+(W-L-R-PAD*2)*(m/SESSION_MINUTES);
  const ticks=[];
  for(let m=0;m<=SESSION_MINUTES;m+=30){
    ticks.push(`<line x1="${x(m)}" y1="${TOP-10}" x2="${x(m)}" y2="${H-26}" stroke="var(--line)" stroke-width="1"/>`+
      `<text x="${x(m)}" y="${TOP-16}" font-size="11" text-anchor="middle" fill="var(--mute)">${laneClock(m)}</text>`);
  }
  const lunch=`<line x1="${x(120)}" y1="${TOP-10}" x2="${x(120)}" y2="${H-26}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 3"/>`+
    `<text x="${x(120)}" y="${H-12}" font-size="11" text-anchor="middle" fill="var(--warn)">午休</text>`;
  const laneRows=all.map((a,i)=>{
    const y=TOP+i*LANE+LANE/2;
    const stacks={};let labelledAt=-99;
    const marks=rows.map((e,index)=>[e,index]).filter(([e])=>e.actor===a.key).map(([e,index])=>{
      const cx=x(sessionMinute(e.at)),key=Math.round(cx/14);
      const slot=(stacks[key]=(stacks[key]||0)+1)-1;
      const cy=y-24+slot*16;
      // Labels only where they fit: a dense cluster keeps the marker and its tooltip.
      const label9=(slot===0&&cx-labelledAt>44)?esc((e.name||e.symbol||'').slice(0,4)):'';
      if(label9)labelledAt=cx;
      const buy=e.side==='buy',done=e.status==='filled'||e.status==='partially_filled';
      const color=e.side==='cancel'?'var(--warn)':buy?'var(--up)':'var(--down)';
      const shape=buy?`M${cx},${cy-6} L${cx+6},${cy+5} L${cx-6},${cy+5} Z`:`M${cx},${cy+6} L${cx+6},${cy-5} L${cx-6},${cy-5} Z`;
      const [label]=STATUS[e.status]||[e.status];
      return `<g class="mk" data-lane-event="${index}" tabindex="0" role="button" style="cursor:pointer">`+
        `<title>${esc(hm(e.at))} ${esc(a.label)} ${SIDE[e.side]||e.side} ${esc(e.name||e.symbol||'')} ${int(e.quantity)} 股 @${e.price!=null?num(e.price,3):'—'} · ${label}</title>`+
        `<path d="${shape}" fill="${done?color:'var(--panel)'}" stroke="${color}" stroke-width="1.6"/>`+
        (label9?`<text x="${cx}" y="${cy+17}" font-size="10" text-anchor="middle" fill="var(--mute)">${label9}</text>`:'')+`</g>`;
    }).join('');
    const rounds=(a.account||{}).decisions||[];
    const roundMarks=rounds.map((z,ri)=>{
      const cx=x(sessionMinute(z.decided_at)),cy=TOP+i*LANE+LANE-9;
      const acted=(z.ledger_orders||[]).length>0||(z.outcomes||[]).some(o=>!o.order_id);
      const failed=z.status!=='decided';
      const fill=failed?'var(--warn)':acted?'var(--accent)':'var(--panel)';
      return `<g class="mk" data-lane-round="${esc(a.key)}|${ri}" tabindex="0" role="button" style="cursor:pointer">`+
        `<title>${esc(hm(z.decided_at))} ${esc(a.label)} ${failed?esc(z.status):acted?'有操作':'本轮不操作'}</title>`+
        `<circle cx="${cx}" cy="${cy}" r="3.4" fill="${fill}" stroke="${failed?'var(--warn)':'var(--accent)'}" stroke-width="1.2"/></g>`;
    }).join('');
    const count=rows.filter(e=>e.actor===a.key).length;
    const colour=`var(--${a.cls})`,laneBg=`var(--${a.cls}-bg)`;
    const pending=a.account&&d.day<a.account.start_date?'账户尚未启动':'等待首轮决策';
    const empty=rounds.length===0&&count===0?`<text x="${x(12)}" y="${y}" font-size="11" fill="${colour}" opacity=".78">${pending}</text>`:'';
    return `<g><rect x="${L}" y="${TOP+i*LANE}" width="${W-L-R}" height="${LANE}" fill="${laneBg}" opacity=".26"/>`+
      `<line x1="${L}" y1="${TOP+i*LANE+LANE}" x2="${W-R}" y2="${TOP+i*LANE+LANE}" stroke="var(--line)"/>`+
      `<text x="8" y="${y}" font-size="12" font-weight="600" fill="${colour}">${esc(a.label)}</text>`+
      `<text x="8" y="${y+16}" font-size="10" fill="var(--mute)">${count} 笔${rounds.length?` · ${rounds.length} 轮`:''}</text>${empty}${roundMarks}${marks}</g>`;
  }).join('');
  return `<div class="panel"><h2><span>按时间看${all.length}方的动作</span>
      <span class="muted small">▲ 买入 ▼ 卖出（实心=已成交） · 底部圆点=决策轮次（蓝实心有操作、空心不操作、黄色失败） · 黄虚线=午休 · 点标记看理由，点自己的成交可写复盘</span></h2>
    <div class="scroll" style="padding:8px 0 0">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;min-width:780px" role="img" aria-label="${all.length}方操作时间轴">
        ${ticks.join('')}${lunch}${laneRows}
      </svg></div>
    <div id="laneDetail" style="padding:10px 12px;border-top:1px solid var(--line)">${laneSelected!=null&&rows[laneSelected]?laneDetailHtml(laneSelected):`<span class="muted small">${rows.length?'点任一标记，看这笔的完整理由。':'这一天没有操作记录。'}</span>`}</div></div>`;
}

function noteEditor(e,index){
  return `<form class="noteform" data-note-index="${index}">

      <div class="noterow"><button type="submit">保存</button>
        <span class="muted small">写入本地数据库，标记为你本人的陈述；留空并保存即删除。</span>
        <span class="muted small" data-note-state>${e.saved_at?`已保存于 ${hm(e.saved_at)}`:'未填写'}</span></div>

async function saveNote(form){
  const index=Number(form.dataset.noteIndex),e=laneEvents[index];
  const state=form.querySelector('[data-note-state]'),button=form.querySelector('button');
  if(!e||!e.order_number)return;
  button.disabled=true;state.textContent='保存中…';
  try{
    const response=await fetch('/api/human-note',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({date:current.day,symbol:e.symbol,order_number:e.order_number,
        intent:form.intent.value,plan:form.plan.value})});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||response.status);
    e.why=form.intent.value.trim();e.plan=form.plan.value.trim();
    e.saved_at=result.saved_at||null;
    state.textContent=result.status==='deleted'?'已清空':`已保存于 ${hm(result.saved_at)}`;
    lastBody='';                                  // 下一次轮询重新渲染，带上落库结果
  }catch(error){state.textContent='保存失败：'+error.message;}
  finally{button.disabled=false;}
}

/* ---------- per-symbol comparison ---------- */
function symbolsView(d){
  const all=actors(d);
  const marks={},names={};
  for(const a of d.accounts)for(const p of (a.navs.at(-1)||{}).positions||[]){marks[p.symbol]=p.price;}
  const cells={};
  const put=(symbol,actor,side,qty,amount,name)=>{
    names[symbol]=names[symbol]||name||'';
    const cell=(cells[symbol]=cells[symbol]||{});
    const it=(cell[actor]=cell[actor]||{buy:0,buyAmt:0,sell:0,sellAmt:0});
    if(side==='buy'){it.buy+=qty;it.buyAmt+=amount;}else if(side==='sell'){it.sell+=qty;it.sellAmt+=amount;}
  };
  for(const o of d.human_trades?.orders||[])put(o.symbol,'me',o.side,Number(o.quantity),Number(o.quantity)*Number(o.avg_price),o.name);
  for(const a of d.accounts)for(const o of a.orders){
    if(!Number(o.filled_quantity))continue;
    put(o.symbol,a.account_key,o.side,Number(o.filled_quantity),Number(o.filled_quantity)*Number(o.fill_price),o.name);
  }
  const held={};
  for(const a of d.accounts)for(const p of a.positions||[])if(Number(p.quantity)>0)((held[p.symbol]=held[p.symbol]||{})[a.account_key]=Number(p.quantity));
  const symbols=[...new Set([...Object.keys(cells),...Object.keys(held)])].sort();
  const head=all.map(a=>`<th>${esc(a.label)}</th>`).join('');
  const body=symbols.map(symbol=>{
    const tds=all.map(a=>{
      const it=(cells[symbol]||{})[a.key],hold=(held[symbol]||{})[a.key];
      if(!it&&!hold)return '<td class="muted small">—</td>';
      const parts=[];
      if(it&&it.buy)parts.push(`<div><span class="side-buy">买 ${int(it.buy)}</span> @${num(it.buyAmt/it.buy,3)}</div>`);
      if(it&&it.sell)parts.push(`<div><span class="side-sell">卖 ${int(it.sell)}</span> @${num(it.sellAmt/it.sell,3)}</div>`);
      if(hold)parts.push(`<div class="muted small">持仓 ${int(hold)} 股</div>`);
      return `<td class="nowrap">${parts.join('')}</td>`;
    }).join('');
    return `<tr><td class="nowrap"><strong>${esc(names[symbol]||'')}</strong><div class="muted small">${esc(symbol)}</div></td>
      <td class="nowrap">${marks[symbol]?num(marks[symbol],3):'—'}</td>${tds}</tr>`;
  }).join('');
  return `<div class="panel"><h2><span>同一只票，${all.length}方各自怎么做的</span><span class="muted small">价格为最近一次记账价</span></h2>
    <div class="scroll"><table><thead><tr><th>标的</th><th>记账价</th>${head}</tr></thead>
    <tbody>${body||`<tr><td colspan="${2+all.length}" class="empty">这一天没有成交。</td></tr>`}</tbody></table></div></div>`;
}

/* ---------- rounds ---------- */
function roundsView(d){
  if(!d.accounts.length)return '<div class="panel"><p class="empty">还没有模拟账户。</p></div>';
  roundAccount=d.accounts.some(a=>a.account_key===roundAccount)?roundAccount:d.accounts[0].account_key;
  const picker=d.accounts.map(a=>`<button data-account="${esc(a.account_key)}" aria-pressed="${a.account_key===roundAccount}">${esc(NAMES[a.account_key]||a.account_key)}</button>`).join('');
  const a=d.accounts.find(x=>x.account_key===roundAccount);
  const rounds=a.decisions.slice().reverse().map(z=>round(z)).join('')||'<p class="empty">这一天没有决策记录。</p>';
  return `<div class="panel"><h2><span>逐轮决策（最新在上）</span><span class="filters">${picker}</span></h2>${rounds}</div>`;
}
function round(z){
  const st=z.status==='decided'?'<span class="badge b-ok">已决策</span>':`<span class="badge b-bad">${esc(z.status)}</span>`;
  const orders=[];
  for(const o of z.ledger_orders||[]){
    const [label,cls]=STATUS[o.status]||[o.status,'b-info'];
    const fill=o.filled_quantity?` ${int(o.filled_quantity)}@${num(o.fill_price,3)}`:'';
    const rej=(o.reject_reasons||[]).map(reason).join('、');
    orders.push(`<div class="order ${esc(o.side)}"><div class="line"><span class="side-${esc(o.side)}">${SIDE[o.side]||o.side}</span> ${esc(o.name??'')} ${esc(o.symbol)} ${int(o.quantity)} 股
      · ${o.order_type==='limit'?'限价 '+num(o.limit_price,3):'市价'} <span class="badge ${cls}">${label}${fill}</span>${rej?`<span class="muted small">${esc(rej)}</span>`:''}</div>
      <div class="why clamp" data-clamp>${esc(o.reason)}</div></div>`);
  }
  for(const o of z.outcomes||[]){
    if(o.order_id)continue;
    const raw=o.order||{};
    orders.push(`<div class="order ${esc(raw.action)}"><div class="line"><span class="side-${esc(raw.action)}">${SIDE[raw.action]||esc(raw.action)}</span> ${esc(raw.symbol)} ${int(raw.quantity)} 股
      <span class="badge b-bad">${o.status==='cancelled'?'已撤':'下单前被拒'}</span><span class="muted small">${esc((o.reasons||[]).map(reason).join('、'))}</span></div>
      <div class="why clamp" data-clamp>${esc(raw.reason)}</div></div>`);
  }
  if(!z.outcomes&&(z.proposed||[]).length>(z.ledger_orders||[]).length)
    orders.push(`<p class="muted small">模型提出 ${z.proposed.length} 笔，入账 ${z.ledger_orders.length} 笔；其余被规则拒绝，旧记录没有保存原因。</p>`);
  const meta=[z.duration_ms?`${(z.duration_ms/1000).toFixed(0)} 秒`:'',z.context_chars?`输入 ${(z.context_chars/1000).toFixed(1)} 千字`:'',
              z.cost_usd?`$${Number(z.cost_usd).toFixed(3)}`:'',z.tool_calls?`查询 ${z.tool_calls} 次`:''].filter(Boolean).join(' · ');
  const chips=(z.searches||[]).length?`<div class="chips">${z.searches.map(s=>`<span class="chip" title="${esc(s.target)}">${s.tool==='WebSearch'?'🔍':'🌐'} ${esc(s.target)}</span>`).join('')}</div>`:'';
  return `<article class="round"><div class="rhead"><span class="t">${hm(z.decided_at)}</span>${st}<span class="muted small">${esc(meta)}</span></div>
    ${z.error?`<div class="error">${esc(z.error)}</div>`:''}
    ${z.market_view?`<p style="margin:6px 0"><strong>盘面：</strong>${esc(z.market_view)}</p>`:''}
    ${z.analysis?`<div class="why clamp" data-clamp><strong>决策依据：</strong>${esc(z.analysis)}</div>`:''}
    ${orders.join('')||(z.status==='decided'?'<p class="muted small">本轮不操作。</p>':'')}
    ${z.notes?`<details class="more"><summary>留给下一轮的笔记</summary><div class="why">${esc(z.notes)}</div></details>`:''}
    ${chips}
    <div class="actions">
      <button data-part="context" data-id="${z.decision_id}" ${z.has_context?'':'disabled'}>看输入</button>
      <button data-part="transcript" data-id="${z.decision_id}" ${z.has_transcript?'':'disabled'}>看过程</button>
      <button data-part="output" data-id="${z.decision_id}">原始输出</button>
      ${z.has_context?'':'<span class="muted small">该轮未存输入原文</span>'}
    </div></article>`;
}

/* ---------- positions & nav ---------- */
function bookView(d){
  const blocks=d.accounts.map(a=>{
    const started=!a.start_date||d.day>=a.start_date;
    const nav=a.navs.at(-1),shownNav=nav||a.latest_nav;
    const marks=Object.fromEntries(((shownNav||{}).positions||[]).map(p=>[p.symbol,p.price]));
    const pos=started?(a.positions||[]).filter(p=>Number(p.quantity)>0):[];
    const rows=pos.map(p=>{
      const price=Number(p.price||marks[p.symbol]||0),cost=Number(p.average_cost??p.avg_cost??0);
      const ret=price&&cost?(price/cost-1)*100:null;
      return `<tr><td class="nowrap"><strong>${esc(p.name??'')}</strong><div class="muted small">${esc(p.symbol)}</div></td>
        <td>${int(p.quantity)}</td><td>${int(p.sellable_quantity??0)}</td><td>${num(cost,3)}</td><td>${price?num(price,3):'—'}</td>
        <td class="${sign(ret)}">${pct(ret)}</td></tr>`;
    }).join('');
    const baselineRow=nav?'':started?shownNav?`<tr><td class="nowrap">${esc(shownNav.trading_date)} ${hm(shownNav.as_of)}</td><td>${num(shownNav.equity)}</td><td>${int(shownNav.cash)}</td><td>${int(shownNav.market_value)}</td><td class="muted small">${esc(shownNav.price_basis)}</td></tr>`:`<tr><td class="nowrap">初始基线</td><td>${num(a.initial_equity)}</td><td>${int(a.cash)}</td><td>${int(Number(a.initial_equity)-Number(a.cash))}</td><td class="muted small">baseline</td></tr>`:`<tr><td colspan="5" class="empty">账户于 ${esc(a.start_date)} 启动</td></tr>`;
    return `<div class="panel"><h2><span>${esc(NAMES[a.account_key]||a.account_key)} 持仓</span>
      <span class="muted small">${nav?`${hm(nav.as_of)} 记账 · 现金 ${int(nav.cash)} · 市值 ${int(nav.market_value)}`:started?shownNav?`截至 ${esc(shownNav.trading_date)} ${hm(shownNav.as_of)} 记账 · 现金 ${int(shownNav.cash)} · 市值 ${int(shownNav.market_value)}`:`尚无盘中记账 · 初始权益 ${num(a.initial_equity)}`:`账户尚未启动`}</span></h2>
      <div class="scroll"><table><thead><tr><th>标的</th><th>数量</th><th>可卖</th><th>成本</th><th>记账价</th><th>浮动</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">空仓</td></tr>'}</tbody></table></div>
      <div class="scroll"><table><thead><tr><th>净值时点</th><th>净值</th><th>现金</th><th>市值</th><th>计价</th></tr></thead><tbody>
        ${a.navs.slice().reverse().slice(0,8).map(n=>`<tr><td class="nowrap">${hm(n.as_of)}</td><td>${num(n.equity)}</td><td>${int(n.cash)}</td><td>${int(n.market_value)}</td><td class="muted small">${esc(n.price_basis)}</td></tr>`).join('')||baselineRow}
      </tbody></table></div></div>`;
  }).join('');
  const mine=(d.human_trades?.journal||[]).map(j=>`<div class="panel"><h2><span>${esc(j.title)}</span><span class="muted small">你的复盘记录</span></h2>
    <div style="padding:10px 12px"><div class="why">${esc(j.body)}</div>
    ${(j.plans||[])[0]?`<p style="margin:8px 0 0"><strong>次日计划：</strong>${esc(j.plans[0].plan)}</p>`:''}
    <p class="muted small">你本人的陈述，非系统推断。</p></div></div>`).join('');
  return `<div class="grid2">${blocks}</div>${mine}`;
}

/* ---------- shell ---------- */
function render(d){

  $('#view').innerHTML=view==='lanes'?lanesView(d):view==='timeline'?timelineView(d):view==='symbols'?symbolsView(d):view==='rounds'?roundsView(d):bookView(d);

async function loadDays(){
  const {days}=await api('/api/days');const sel=$('#day');const keep=sel.value;
  sel.innerHTML=days.map(x=>`<option>${x}</option>`).join('');
  if(keep&&days.includes(keep))sel.value=keep;
}
async function load(force){
  try{
    const day=$('#day').value;const body=await api('/api/day'+(day?`?date=${day}`:''));
    $('#error').hidden=true;
    $('#stamp').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`+(body.day===body.latest_day?' · 每 20 秒自动刷新':'');
    const text=JSON.stringify(body);
    if(force||text!==lastBody){lastBody=text;current=body;render(body);}
  }catch(e){$('#error').hidden=false;$('#error').textContent='读取失败：'+e.message;}
}

function tree(value,key,open){
  const k=key!=null?`<span class="k">${esc(key)}</span>: `:'';
  if(value===null||typeof value!=='object'){
    const cls=typeof value==='string'?'s':typeof value==='number'?'n':'';
    return `<div class="leaf">${k}<span class="${cls}">${esc(typeof value==='string'?value:JSON.stringify(value))}</span></div>`;
  }
  const entries=Array.isArray(value)?value.map((v,i)=>[i,v]):Object.entries(value);
  const label=Array.isArray(value)?`[${entries.length}]`:`{${entries.length}}`;
  return `<details ${open?'open':''}><summary>${k}<span class="muted">${label}</span></summary>${entries.map(([kk,v])=>tree(v,kk,false)).join('')}</details>`;
}
function transcript(items){
  return items.map(e=>{
    if(e.type==='tool_use')return `<div class="tx"><span class="badge b-info">${esc(e.name)}</span> ${esc(e.input?.query||e.input?.url||'')}<pre>${esc(JSON.stringify(e.input,null,1))}</pre></div>`;
    if(e.type==='tool_result')return `<details class="tx"><summary><span class="badge ${e.is_error?'b-bad':'b-ok'}">工具返回</span> <span class="muted small">${esc(String(e.content).slice(0,120))}</span></summary><pre>${esc(e.content)}</pre></details>`;
    if(e.type==='thinking')return `<details class="tx"><summary><span class="badge b-warn">思考</span> <span class="muted small">${esc(String(e.text).slice(0,120))}</span></summary><pre>${esc(e.text)}</pre></details>`;
    if(e.type==='text')return `<div class="tx"><span class="badge b-warn">模型</span><pre>${esc(e.text)}</pre></div>`;
    return `<details class="tx" ${e.type==='stdout'?'open':''}><summary><span class="badge b-info">${esc(e.type)}</span></summary><pre>${esc(e.text)}</pre></details>`;
  }).join('')||'<p class="empty">没有过程记录。</p>';
}
async function openDetail(id,part){
  const titles={context:'当时的输入（模型看到的全部数据）',transcript:'决策过程',output:'模型原始输出'};
  $('#dlgtitle').textContent=titles[part];$('#dlgbody').innerHTML='<p class="empty">读取中…</p>';$('#dlg').showModal();
  try{
    const d=await api(`/api/decision/${id}?part=${part}`);
    const head=`<p class="muted small">${esc(d.account_key)} · ${esc(new Date(d.decided_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</p>`;
    $('#dlgbody').innerHTML=head+(part==='transcript'?transcript(d.body||[]):`<div class="tree">${tree(d.body,null,true)}</div>`);
  }catch(e){$('#dlgbody').innerHTML=`<div class="error">${esc(e.message)}</div>`;}
}

document.addEventListener('click',e=>{
  const detail=e.target.closest('button[data-part]');
  if(detail)return openDetail(detail.dataset.id,detail.dataset.part);
  const tab=e.target.closest('#tabs button');
  if(tab){view=tab.dataset.view;for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-selected',String(b===tab));return render(current);}
  const actor=e.target.closest('button[data-actor]');
  // A chip isolates one actor; clicking the active chip (or 全部) shows everyone.
  if(actor){const key=actor.dataset.actor;
    actorFilter=(key==='all'||(actorFilter.size===1&&actorFilter.has(key)))?new Set():new Set([key]);
    return render(current);}
  const account=e.target.closest('button[data-account]');
  if(account){roundAccount=account.dataset.account;return render(current);}
  const mark=e.target.closest('[data-lane-event]');
  if(mark)return laneDetail(Number(mark.dataset.laneEvent));
  const dot=e.target.closest('[data-lane-round]');
  if(dot)return laneRoundDetail(dot.dataset.laneRound);
  const clamp=e.target.closest('[data-clamp]');
  if(clamp)clamp.classList.toggle('open');
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('form.noteform');
  if(form){e.preventDefault();saveNote(form);}
});
$('#dlgclose').onclick=()=>$('#dlg').close();
$('#refresh').onclick=()=>load(true);
$('#day').onchange=()=>load(true);
(async()=>{await loadDays();await load(true);
  setInterval(async()=>{if(!current||current.day!==current.latest_day)return;await loadDays();if($('#day').value===current.latest_day||!$('#day').value)load();},20000);})();
</script>
