name: n8n

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-72}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-1000}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      N8N_METRICS: ${N8N_METRICS:-true}
      # The active research workflows use HTTP nodes only.  Allow the local
      # deployment to use n8n's in-process JS runner when the external broker
      # leaves executions in `running`; production can explicitly set
      # N8N_RUNNERS_MODE=external after a broker SLO has been verified.
      N8N_RUNNERS_MODE: ${N8N_RUNNERS_MODE:-internal}
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      # Keep the JavaScript runner registered between the 15-minute analyst
      # sync ticks. The default 60s idle shutdown can leave the broker with
      # only the Python offer, while these workflows contain Code nodes.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-900}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      # The managed analyst-sync workflows read only the injected archive base
      # URL and quant write key by expression.  Credentials remain n8n
      # references; the values are never exported to the repository.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-512}
      N8N_FORMDATA_FILE_SIZE_MAX: ${N8N_FORMDATA_FILE_SIZE_MAX:-512}
      NODE_EXTRA_CA_CERTS: /opt/n8n-certs/market-review-api.pem
      # All market schedules use the exchange calendar in China Standard Time.
      # Explicit per-workflow settings remain supported; this is the safe default
      # for media/error workflows and for any newly-created n8n workflow.
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY:?Set QUANT_WRITE_API_KEY in .env}
      REMOTE_ANALYST_ARCHIVE_BASE_URL: ${REMOTE_ANALYST_ARCHIVE_BASE_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./certs/market-review-api.pem:/opt/n8n-certs/market-review-api.pem:ro

  n8n-runners:
    image: n8nio/runners:2.33.7
    container_name: n8n-runners
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-900}
      # HTTP/Code expressions in external runners read these injected values
      # for the managed analyst-sync workflows. They are not exported into
      # workflow JSON or logged as credentials.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      REMOTE_ANALYST_ARCHIVE_BASE_URL: ${REMOTE_ANALYST_ARCHIVE_BASE_URL:-}
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY:?Set QUANT_WRITE_API_KEY in .env}
      TZ: Asia/Shanghai
    volumes:
      - n8n_data:/home/node/.n8n

  feishu-adapter:
    build:
      context: .
      dockerfile: feishu-adapter/Dockerfile
    image: n8n-feishu-adapter:local
    container_name: n8n-feishu-adapter
    user: "0:0"
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
      quant-research:
        condition: service_healthy
    ports:
      - "127.0.0.1:5680:3000"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: n8n
      PGUSER: n8n
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INGESTION_STORAGE_DIR: /var/lib/adapter-ingestion
      FEISHU_APP_ID: ${FEISHU_APP_ID:?Set FEISHU_APP_ID in .env}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?Set FEISHU_APP_SECRET in .env}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-text
      N8N_TEXT_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-text
      N8N_MEDIA_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-media
      N8N_MEDIA_PART_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-part
      N8N_MEDIA_FINALIZE_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-finalize
      N8N_MEDIA_STATE_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-state
      DASHBOARD_PORT: 3000
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-8388608}
      FEISHU_DEDUPE_TTL_MS: ${FEISHU_DEDUPE_TTL_MS:-600000}
      INGESTION_RECONCILE_SECONDS: ${INGESTION_RECONCILE_SECONDS:-300}
      INGESTION_LEDGER_RETENTION_DAYS: ${INGESTION_LEDGER_RETENTION_DAYS:-90}
      INGESTION_MAX_FILE_BYTES: ${INGESTION_MAX_FILE_BYTES:-524288000}
      QUANT_SERVICE_URL: http://quant-research:8000
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY:?Set QUANT_WRITE_API_KEY in .env}
      QUANT_ALERT_WEBHOOK_TOKEN: ${QUANT_ALERT_WEBHOOK_TOKEN:-}
      FEISHU_ALERT_RECEIVE_ID: ${FEISHU_ALERT_RECEIVE_ID:-}
      FEISHU_ALERT_RECEIVE_ID_TYPE: ${FEISHU_ALERT_RECEIVE_ID_TYPE:-chat_id}
    volumes:
      - adapter_ingestion_data:/var/lib/adapter-ingestion

  quant-research:
    build:
      context: .
      dockerfile: quant-service/Dockerfile
    image: n8n-quant-research:local
    container_name: n8n-quant-research
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QUANT_PORT:-5681}:8000"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: n8n
      PGUSER: n8n
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      QUANT_DB_POOL_MIN_SIZE: ${QUANT_DB_POOL_MIN_SIZE:-1}
      QUANT_DB_POOL_MAX_SIZE: ${QUANT_DB_POOL_MAX_SIZE:-12}
      QUANT_DB_POOL_TIMEOUT_SECONDS: ${QUANT_DB_POOL_TIMEOUT_SECONDS:-10}
      QUANT_PROVIDER_GLOBAL_RATE_LIMIT_MAX_WAIT_SECONDS: ${QUANT_PROVIDER_GLOBAL_RATE_LIMIT_MAX_WAIT_SECONDS:-5}
      QUANT_DATA_DIR: /var/lib/quant
      QUANT_RUNTIME_MIN_FREE_BYTES: ${QUANT_RUNTIME_MIN_FREE_BYTES:-1073741824}
      QUANT_RUNTIME_MAX_MEMORY_RATIO: ${QUANT_RUNTIME_MAX_MEMORY_RATIO:-0.85}
      QUANT_LEGACY_SCHEMA_BOOTSTRAP: ${QUANT_LEGACY_SCHEMA_BOOTSTRAP:-false}
      QUANT_MIGRATION_LOCK_TIMEOUT_SECONDS: ${QUANT_MIGRATION_LOCK_TIMEOUT_SECONDS:-60}
      POST_CLOSE_REFRESH_LEASE_SECONDS: ${POST_CLOSE_REFRESH_LEASE_SECONDS:-1800}
      AKSHARE_MAX_WORKERS: ${AKSHARE_MAX_WORKERS:-4}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      TUSHARE_PRIMARY_TOKEN: ${TUSHARE_PRIMARY_TOKEN:-}
      TUSHARE_PRIMARY_API_URL: ${TUSHARE_PRIMARY_API_URL:-}
      TUSHARE_SUPER_TOKEN: ${TUSHARE_SUPER_TOKEN:-}
      TUSHARE_SUPER_API_URL: ${TUSHARE_SUPER_API_URL:-}
      TUSHARE_SUPER_PROXY_URL: ${TUSHARE_SUPER_PROXY_URL:-}
      TUSHARE_SUPER_SDK_TOKEN: ${TUSHARE_SUPER_SDK_TOKEN:-}
      TUSHARE_SUPER_SDK_API_URL: ${TUSHARE_SUPER_SDK_API_URL:-}
      TUSHARE_SUPER_SDK_PROXY_URL: ${TUSHARE_SUPER_SDK_PROXY_URL:-}
      TUSHARE_SUPER_SDK_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_SDK_REQUESTS_PER_MINUTE:-}
      TUSHARE_SUPER_REALTIME_API_KEY: ${TUSHARE_SUPER_REALTIME_API_KEY:-}
      TUSHARE_SUPER_REALTIME_FALLBACK_API_KEY: ${TUSHARE_SUPER_REALTIME_FALLBACK_API_KEY:-}
      TUSHARE_SUPER_REALTIME_API_URL: ${TUSHARE_SUPER_REALTIME_API_URL:-}
      TUSHARE_SUPER_REALTIME_PROXY_URL: ${TUSHARE_SUPER_REALTIME_PROXY_URL:-}
      TUSHARE_SUPER_REALTIME_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_REALTIME_REQUESTS_PER_MINUTE:-60}
      INTRADAY_ORDER_BOOK_MAX_SYMBOLS: ${INTRADAY_ORDER_BOOK_MAX_SYMBOLS:-40}
      TUSHARE_SUPER_GET_API_KEY: ${TUSHARE_SUPER_GET_API_KEY:-}
      TUSHARE_SUPER_GET_FALLBACK_API_KEY: ${TUSHARE_SUPER_GET_FALLBACK_API_KEY:-}
      TUSHARE_SUPER_GET_API_URL: ${TUSHARE_SUPER_GET_API_URL:-}
      TUSHARE_SUPER_GET_PROXY_URL: ${TUSHARE_SUPER_GET_PROXY_URL:-}
      TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_GET_REQUESTS_PER_MINUTE:-}
      TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS: ${TUSHARE_SUPER_GET_MIN_INTERVAL_SECONDS:-1}
      TUSHARE_SUPER_GET_MAX_WORKERS: ${TUSHARE_SUPER_GET_MAX_WORKERS:-8}
      XINHUA_FINANCE_API_URL: ${XINHUA_FINANCE_API_URL:-}
      XINHUA_FINANCE_API_KEY: ${XINHUA_FINANCE_API_KEY:-}
      TUSHARE_BACKUP_API_KEY: ${TUSHARE_BACKUP_API_KEY:-}
      TUSHARE_BACKUP_API_URL: ${TUSHARE_BACKUP_API_URL:-}
      TUSHARE_PRIMARY_REQUESTS_PER_MINUTE: ${TUSHARE_PRIMARY_REQUESTS_PER_MINUTE:-60}
      TUSHARE_SUPER_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_REQUESTS_PER_MINUTE:-30}
      TUSHARE_BACKUP_REQUESTS_PER_MINUTE: ${TUSHARE_BACKUP_REQUESTS_PER_MINUTE:-6}
      QUANT_UNIVERSE: ${QUANT_UNIVERSE:-}
      MARKET_SNAPSHOT_MIN_UNIVERSE: ${MARKET_SNAPSHOT_MIN_UNIVERSE:-1000}
      MARKET_SNAPSHOT_MIN_COVERAGE: ${MARKET_SNAPSHOT_MIN_COVERAGE:-0.95}
      MARKET_SNAPSHOT_LICENSED_PROVIDERS: ${MARKET_SNAPSHOT_LICENSED_PROVIDERS:-}
      MARKET_SNAPSHOT_ENABLE_PUBLIC_BATCH: ${MARKET_SNAPSHOT_ENABLE_PUBLIC_BATCH:-false}
      MARKET_SNAPSHOT_ENABLE_TENCENT_SNAPSHOT: ${MARKET_SNAPSHOT_ENABLE_TENCENT_SNAPSHOT:-true}
      MARKET_SNAPSHOT_PUBLIC_BATCH_SIZE: ${MARKET_SNAPSHOT_PUBLIC_BATCH_SIZE:-80}
      MARKET_SNAPSHOT_PUBLIC_CONCURRENCY: ${MARKET_SNAPSHOT_PUBLIC_CONCURRENCY:-2}
      AKSHARE_MAX_QUEUE: ${AKSHARE_MAX_QUEUE:-8}
      QUANT_DB_BLOCKING_MAX_QUEUE: ${QUANT_DB_BLOCKING_MAX_QUEUE:-8}
      QUANT_ALERT_WEBHOOK_URL: http://feishu-adapter:3000/internal/quant-alert
      QUANT_ALERT_WEBHOOK_TOKEN: ${QUANT_ALERT_WEBHOOK_TOKEN:-}
      QUANT_DASHBOARD_PUBLIC_URL: ${QUANT_DASHBOARD_PUBLIC_URL:-}
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY:?Set QUANT_WRITE_API_KEY in .env}
      # This credential is intentionally injected only from ignored local
      # environment configuration. The service reads extracted text endpoints
      # only; it never dereferences archive media URLs.
      REMOTE_ANALYST_ARCHIVE_BASE_URL: ${REMOTE_ANALYST_ARCHIVE_BASE_URL:-}
      REMOTE_ANALYST_ARCHIVE_CA_FILE: /opt/market-review-api.pem
      REMOTE_ANALYST_SYNC_MAX_ITEMS: ${REMOTE_ANALYST_SYNC_MAX_ITEMS:-100}
      REMOTE_ANALYST_SYNC_MIN_INTERVAL_SECONDS: ${REMOTE_ANALYST_SYNC_MIN_INTERVAL_SECONDS:-15}
      REMOTE_ANALYST_SYNC_REQUEST_INTERVAL_SECONDS: ${REMOTE_ANALYST_SYNC_REQUEST_INTERVAL_SECONDS:-2}
      INTRADAY_SCAN_INTERVAL_SECONDS: ${INTRADAY_SCAN_INTERVAL_SECONDS:-30}
      INTRADAY_SUPER_GET_FAST_INTERVAL_SECONDS: ${INTRADAY_SUPER_GET_FAST_INTERVAL_SECONDS:-1}
      INTRADAY_SUPER_GET_FAST_MAX_IN_FLIGHT: ${INTRADAY_SUPER_GET_FAST_MAX_IN_FLIGHT:-20}
      TUSHARE_SUPER_GET_MAX_QUEUE: ${TUSHARE_SUPER_GET_MAX_QUEUE:-8}
      ALL_BOARD_MEMBER_BACKFILL_ENABLED: ${ALL_BOARD_MEMBER_BACKFILL_ENABLED:-true}
      ALL_BOARD_MEMBER_BACKFILL_BATCH_SIZE: ${ALL_BOARD_MEMBER_BACKFILL_BATCH_SIZE:-10}
      INTRADAY_FAST_QUOTE_RETENTION_DAYS: ${INTRADAY_FAST_QUOTE_RETENTION_DAYS:-7}
      INTRADAY_BOARD_CURVE_ENABLED: ${INTRADAY_BOARD_CURVE_ENABLED:-true}
      INTRADAY_BOARD_CURVE_RETENTION_DAYS: ${INTRADAY_BOARD_CURVE_RETENTION_DAYS:-60}
      INTRADAY_BOARD_ROTATION_RETENTION_DAYS: ${INTRADAY_BOARD_ROTATION_RETENTION_DAYS:-60}
      INTRADAY_BOARD_ROTATION_MIN_DELTA: ${INTRADAY_BOARD_ROTATION_MIN_DELTA:-2.0}
      INTRADAY_BOARD_ROTATION_MIN_ABS_NET: ${INTRADAY_BOARD_ROTATION_MIN_ABS_NET:-1.0}
      INTRADAY_MINUTE_PROFILE_CAPTURE_ENABLED: ${INTRADAY_MINUTE_PROFILE_CAPTURE_ENABLED:-true}
      INTRADAY_MINUTE_PROFILE_RETENTION_DAYS: ${INTRADAY_MINUTE_PROFILE_RETENTION_DAYS:-90}
      INTRADAY_MINUTE_PROFILE_MAX_SYMBOLS: ${INTRADAY_MINUTE_PROFILE_MAX_SYMBOLS:-40}
      INTRADAY_ORDER_BOOK_ENABLED: ${INTRADAY_ORDER_BOOK_ENABLED:-true}
      INTRADAY_ORDER_BOOK_INTERVAL_SECONDS: ${INTRADAY_ORDER_BOOK_INTERVAL_SECONDS:-3}
      INTRADAY_ORDER_BOOK_RETENTION_DAYS: ${INTRADAY_ORDER_BOOK_RETENTION_DAYS:-7}
      STRATEGY_REVIEW_AUTOMATION_ENABLED: ${STRATEGY_REVIEW_AUTOMATION_ENABLED:-true}
      POST_CLOSE_STRATEGY_AUTOMATION_ENABLED: ${POST_CLOSE_STRATEGY_AUTOMATION_ENABLED:-true}
      DAILY_SUMMARY_AUTOMATION_ENABLED: ${DAILY_SUMMARY_AUTOMATION_ENABLED:-true}
      THS_CONCEPT_MEMBER_BACKFILL_ENABLED: ${THS_CONCEPT_MEMBER_BACKFILL_ENABLED:-true}
      THS_CONCEPT_MEMBER_BACKFILL_BATCH_SIZE: ${THS_CONCEPT_MEMBER_BACKFILL_BATCH_SIZE:-25}
      NO_PROXY: "*"
    volumes:
      - quant_data:/var/lib/quant
      - ./certs/market-review-api.pem:/opt/market-review-api.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  n8n_data:
  postgres_data:
  adapter_ingestion_data:
  quant_data:
