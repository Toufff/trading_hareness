services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    container_name: feishu-relay-edge-n8n
    network_mode: host
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: 127.0.0.1
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${RELAY_PGDATABASE}
      DB_POSTGRESDB_USER: ${RELAY_PGUSER}
      DB_POSTGRESDB_PASSWORD: ${RELAY_PGPASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "900"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      QUANT_SERVICE_URL: http://127.0.0.1:18110
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY}
      REMOTE_ANALYST_ARCHIVE_BASE_URL: ${REMOTE_ANALYST_ARCHIVE_BASE_URL:-}
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      NODE_EXTRA_CA_CERTS: /opt/n8n-certs/market-review-api.pem
    volumes:
      - n8n_data:/home/node/.n8n
      - ./certs/market-review-api.pem:/opt/n8n-certs/market-review-api.pem:ro
      - ./import:/import:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  feishu-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
      args:
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_RELEASE: ${APP_RELEASE:-unknown}
        APP_BUILD_CREATED_AT: ${APP_BUILD_CREATED_AT:-unknown}
    image: ${FEISHU_ADAPTER_IMAGE:-feishu-relay-edge-adapter:local}
    container_name: feishu-relay-edge-adapter
    network_mode: host
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: ${RELAY_PGDATABASE}
      PGUSER: ${RELAY_PGUSER}
      PGPASSWORD: ${RELAY_PGPASSWORD}
      INGESTION_STORAGE_DIR: /var/lib/adapter-ingestion
      FEISHU_APP_ID: ${FEISHU_APP_ID}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET}
      FEISHU_LONG_CONNECTION_ENABLED: ${FEISHU_LONG_CONNECTION_ENABLED:-false}
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-text
      N8N_TEXT_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-text
      N8N_MEDIA_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-market-media
      N8N_MEDIA_PART_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-part
      N8N_MEDIA_FINALIZE_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-finalize
      N8N_MEDIA_STATE_WEBHOOK_URL: http://127.0.0.1:5678/webhook/feishu-media-state
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: 18300
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-8388608}
      FEISHU_DEDUPE_TTL_MS: ${FEISHU_DEDUPE_TTL_MS:-600000}
      INGESTION_RECONCILE_SECONDS: ${INGESTION_RECONCILE_SECONDS:-300}
      INGESTION_LEDGER_RETENTION_DAYS: ${INGESTION_LEDGER_RETENTION_DAYS:-90}
      INGESTION_MAX_FILE_BYTES: ${INGESTION_MAX_FILE_BYTES:-524288000}
      QUANT_SERVICE_URL: http://127.0.0.1:18110
      QUANT_WRITE_API_KEY: ${QUANT_WRITE_API_KEY}
      QUANT_ALERT_WEBHOOK_TOKEN: ${QUANT_ALERT_WEBHOOK_TOKEN:-}
      FEISHU_ALERT_RECEIVE_ID: ${FEISHU_ALERT_RECEIVE_ID:-}
      FEISHU_ALERT_RECEIVE_ID_TYPE: ${FEISHU_ALERT_RECEIVE_ID_TYPE:-chat_id}
      FEISHU_GROUP_RELAY_ENABLED: ${FEISHU_GROUP_RELAY_ENABLED:-false}
      FEISHU_RELAY_WRITER_ID: ${FEISHU_RELAY_WRITER_ID:-relay-edge-47}
      FEISHU_GROUP_RELAY_INTERVAL_SECONDS: ${FEISHU_GROUP_RELAY_INTERVAL_SECONDS:-10}
      FEISHU_GROUP_RELAY_ACTION_CARDS_ENABLED: ${FEISHU_GROUP_RELAY_ACTION_CARDS_ENABLED:-false}
      FEISHU_GROUP_RELAY_HISTORY_LOOKBACK_SECONDS: ${FEISHU_GROUP_RELAY_HISTORY_LOOKBACK_SECONDS:-300}
      FEISHU_GROUP_RELAY_BOOTSTRAP_MODE: ${FEISHU_GROUP_RELAY_BOOTSTRAP_MODE:-skip_existing}
      FEISHU_GROUP_RELAY_RECONCILE_SECONDS: ${FEISHU_GROUP_RELAY_RECONCILE_SECONDS:-21600}
      FEISHU_GROUP_RELAY_RECONCILE_LOOKBACK_SECONDS: ${FEISHU_GROUP_RELAY_RECONCILE_LOOKBACK_SECONDS:-86400}
      FEISHU_GROUP_RELAY_TARGET_CHAT_ID: ${FEISHU_GROUP_RELAY_TARGET_CHAT_ID:-oc_523b7e9e29854acba64272a948cb8eda}
      FEISHU_GROUP_RELAY_ANQIANG_CHAT_ID: ${FEISHU_GROUP_RELAY_ANQIANG_CHAT_ID:-oc_1de6464db12c43bf60985f7131e6334a}
      FEISHU_GROUP_RELAY_ANQIANG_CHAT_NAME: ${FEISHU_GROUP_RELAY_ANQIANG_CHAT_NAME:-马安强 (1)}
      FEISHU_GROUP_RELAY_LIWEI_CHAT_ID: ${FEISHU_GROUP_RELAY_LIWEI_CHAT_ID:-oc_4ed9fdb72a152bc921b2d34bd4a1df14}
      FEISHU_GROUP_RELAY_LIWEI_CHAT_NAME: ${FEISHU_GROUP_RELAY_LIWEI_CHAT_NAME:-消息更新群}
      FEISHU_GROUP_RELAY_LIWEI_TARGET_CHAT_IDS: ${FEISHU_GROUP_RELAY_LIWEI_TARGET_CHAT_IDS:-}
      FEISHU_GROUP_RELAY_QUANNENG_CHAT_ID: ${FEISHU_GROUP_RELAY_QUANNENG_CHAT_ID:-oc_d6a89890c3a62517116a2c63f015e0a0}
      FEISHU_GROUP_RELAY_QUANNENG_CHAT_NAME: ${FEISHU_GROUP_RELAY_QUANNENG_CHAT_NAME:-新野人哥会员群【禁言】}
      FEISHU_GROUP_RELAY_XIAOJIE_CHAT_ID: ${FEISHU_GROUP_RELAY_XIAOJIE_CHAT_ID:-}
      FEISHU_GROUP_RELAY_XIAOJIE_CHAT_NAME: ${FEISHU_GROUP_RELAY_XIAOJIE_CHAT_NAME:-小杰夜报～}
      WECHAT_GROUP_RELAY_ENABLED: ${WECHAT_GROUP_RELAY_ENABLED:-false}
      WECHAT_GROUP_RELAY_SOURCE_KEY: ${WECHAT_GROUP_RELAY_SOURCE_KEY:-wechat_xiaolan}
      WECHAT_GROUP_RELAY_SOURCE_CHAT_ID: ${WECHAT_GROUP_RELAY_SOURCE_CHAT_ID:-50136408612@chatroom}
      WECHAT_GROUP_RELAY_ROUTE_TAG: ${WECHAT_GROUP_RELAY_ROUTE_TAG:-xiaolan}
      WECHAT_GROUP_RELAY_TARGET_CHAT_ID: ${WECHAT_GROUP_RELAY_TARGET_CHAT_ID:-}
      WECHAT_GROUP_RELAY_ENDPOINT_TOKEN: ${WECHAT_GROUP_RELAY_ENDPOINT_TOKEN:-}
      WECHAT_GROUP_RELAY_MAX_TEXT_LENGTH: ${WECHAT_GROUP_RELAY_MAX_TEXT_LENGTH:-3500}
      FEISHU_SUMMARY_LISTENER_ENABLED: ${FEISHU_SUMMARY_LISTENER_ENABLED:-false}
      FEISHU_SUMMARY_LISTENER_INTERVAL_SECONDS: ${FEISHU_SUMMARY_LISTENER_INTERVAL_SECONDS:-10}
      FEISHU_SUMMARY_LISTENER_HISTORY_LOOKBACK_SECONDS: ${FEISHU_SUMMARY_LISTENER_HISTORY_LOOKBACK_SECONDS:-3600}
      FEISHU_SUMMARY_LISTENER_BOOTSTRAP_MODE: ${FEISHU_SUMMARY_LISTENER_BOOTSTRAP_MODE:-forward_existing}
      FEISHU_USER_OAUTH_REDIRECT_URI: ${FEISHU_USER_OAUTH_REDIRECT_URI:-http://localhost:8080/callback}
      FEISHU_WORKBENCH_PUBLIC_BASE_URL: ${FEISHU_WORKBENCH_PUBLIC_BASE_URL:-}
      FEISHU_WORKBENCH_DRIVE_FOLDER_TOKEN: ${FEISHU_WORKBENCH_DRIVE_FOLDER_TOKEN:-}
      FEISHU_WORKBENCH_DRIVE_MAX_FILE_BYTES: ${FEISHU_WORKBENCH_DRIVE_MAX_FILE_BYTES:-524288000}
      FEISHU_WORKBENCH_WIKI_SPACE_ID: ${FEISHU_WORKBENCH_WIKI_SPACE_ID:-}
      FEISHU_WORKBENCH_WIKI_PARENT_NODE_TOKEN: ${FEISHU_WORKBENCH_WIKI_PARENT_NODE_TOKEN:-}
      FEISHU_WORKBENCH_TASKLIST_GUID: ${FEISHU_WORKBENCH_TASKLIST_GUID:-}
      TZ: Asia/Shanghai
    volumes:
      - ./adapter-ingestion:/var/lib/adapter-ingestion
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:18300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  n8n_data:
