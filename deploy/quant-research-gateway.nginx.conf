server {
    listen 8000;
    server_name _;

    # Docker assigns a new IP whenever the quant container is recreated. Use
    # its embedded DNS for every proxy resolution so the gateway never keeps
    # forwarding n8n traffic to a retired container address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $quant_research_backend quant-research:8000;

    # No cache and no retry for non-idempotent research writes: caller-side
    # request keys remain the single source of idempotency.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        # The one-click post-close pipeline has explicit stages with a total
        # adapter budget of 360s.  Keep this proxy above that end-to-end
        # window, otherwise the write may continue server-side after a 504
        # and tempt callers to submit a duplicate refresh.
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_next_upstream off;
        proxy_set_header Connection "";
        proxy_pass http://$quant_research_backend;
    }
}
