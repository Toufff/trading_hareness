# Compress static code before the origin-to-edge hop, including authenticated
# asset requests. Nginx's default gzip_types only covers HTML.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_types application/javascript text/javascript text/css application/json;

# Dynamic endpoints are served by the Windows adapter through a loopback-only
# reverse SSH tunnel. PostgreSQL and raw history never leave the G: drive.
#
# The public virtual host also has a generic ``location /api/`` that points at
# the native quant service.  The browser intentionally calls the adapter's
# compatibility surface under ``/api/research/``; without this more-specific
# route Nginx sent those requests to the wrong process and every dashboard
# panel received a real HTTP 404.  Keep the split explicit instead of teaching
# the frontend two different public/local URL schemes.
location = /api/config {
    proxy_pass http://127.0.0.1:15680;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /api/research/ {
    proxy_pass http://127.0.0.1:15680;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    add_header Cache-Control "private, no-store" always;
}

# All versioned contracts are produced by the sole G-drive owner platform.
# Never send some v1 pages to the retired SQLite-backed service: that creates
# different universes/dates on different tabs even when each HTTP call works.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:15681;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    add_header Cache-Control "private, no-store" always;
}

location = /health {
    proxy_pass http://127.0.0.1:15680;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    add_header Cache-Control "private, no-store" always;
}

location = /events {
    proxy_pass http://127.0.0.1:15680;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header Cache-Control "private, no-store" always;
}
