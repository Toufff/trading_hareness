name: market-relay

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_DOMAIN:?Set N8N_DOMAIN in .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:?Set N8N_DOMAIN in .env}
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN:?Set N8N_DOMAIN in .env}/
      N8N_SECURE_COOKIE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE:-true}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-72}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-1000}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      N8N_METRICS: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-512}
      N8N_FORMDATA_FILE_SIZE_MAX: ${N8N_FORMDATA_FILE_SIZE_MAX:-512}
      NODE_EXTRA_CA_CERTS: /opt/n8n-certs/market-review-api.pem
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    volumes:
      - n8n_data:/home/node/.n8n
      - ../certs/market-review-api.pem:/opt/n8n-certs/market-review-api.pem:ro

  n8n-runners:
    image: n8nio/runners:2.33.7
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n_data:/home/node/.n8n

  quant-research:
    build:
      context: ..
      dockerfile: quant-service/Dockerfile
    image: n8n-quant-research:server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: n8n
      PGUSER: n8n
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      TUSHARE_PRIMARY_TOKEN: ${TUSHARE_PRIMARY_TOKEN:-}
      TUSHARE_PRIMARY_API_URL: ${TUSHARE_PRIMARY_API_URL:-}
      TUSHARE_SUPER_TOKEN: ${TUSHARE_SUPER_TOKEN:-}
      TUSHARE_SUPER_API_URL: ${TUSHARE_SUPER_API_URL:-}
      TUSHARE_SUPER_PROXY_URL: ${TUSHARE_SUPER_PROXY_URL:-}
      TUSHARE_BACKUP_API_KEY: ${TUSHARE_BACKUP_API_KEY:-}
      TUSHARE_BACKUP_API_URL: ${TUSHARE_BACKUP_API_URL:-}
      TUSHARE_PRIMARY_REQUESTS_PER_MINUTE: ${TUSHARE_PRIMARY_REQUESTS_PER_MINUTE:-60}
      TUSHARE_SUPER_REQUESTS_PER_MINUTE: ${TUSHARE_SUPER_REQUESTS_PER_MINUTE:-30}
      TUSHARE_BACKUP_REQUESTS_PER_MINUTE: ${TUSHARE_BACKUP_REQUESTS_PER_MINUTE:-6}
      QUANT_UNIVERSE: ${QUANT_UNIVERSE:-}
      MARKET_SNAPSHOT_MIN_UNIVERSE: ${MARKET_SNAPSHOT_MIN_UNIVERSE:-1000}
      MARKET_SNAPSHOT_MIN_COVERAGE: ${MARKET_SNAPSHOT_MIN_COVERAGE:-0.95}
      MARKET_SNAPSHOT_LICENSED_PROVIDERS: ${MARKET_SNAPSHOT_LICENSED_PROVIDERS:-}
      MARKET_SNAPSHOT_ENABLE_PUBLIC_BATCH: ${MARKET_SNAPSHOT_ENABLE_PUBLIC_BATCH:-false}
      MARKET_SNAPSHOT_PUBLIC_BATCH_SIZE: ${MARKET_SNAPSHOT_PUBLIC_BATCH_SIZE:-80}
      MARKET_SNAPSHOT_PUBLIC_CONCURRENCY: ${MARKET_SNAPSHOT_PUBLIC_CONCURRENCY:-2}
    volumes:
      - quant_data:/var/lib/quant
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  feishu-adapter:
    build:
      context: ..
      dockerfile: feishu-adapter/Dockerfile
    image: n8n-feishu-adapter:server
    user: "0:0"
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
      quant-research:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: n8n
      PGUSER: n8n
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      INGESTION_STORAGE_DIR: /var/lib/adapter-ingestion
      FEISHU_APP_ID: ${FEISHU_APP_ID:?Set FEISHU_APP_ID in .env}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?Set FEISHU_APP_SECRET in .env}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-text
      N8N_TEXT_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-text
      N8N_MEDIA_WEBHOOK_URL: http://n8n:5678/webhook/feishu-market-media
      N8N_MEDIA_PART_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-part
      N8N_MEDIA_FINALIZE_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-finalize
      N8N_MEDIA_STATE_WEBHOOK_URL: http://n8n:5678/webhook/feishu-media-state
      QUANT_SERVICE_URL: http://quant-research:8000
      DASHBOARD_PORT: 3000
      UPLOAD_PART_BYTES: ${UPLOAD_PART_BYTES:-8388608}
      FEISHU_DEDUPE_TTL_MS: ${FEISHU_DEDUPE_TTL_MS:-600000}
      INGESTION_RECONCILE_SECONDS: ${INGESTION_RECONCILE_SECONDS:-300}
      INGESTION_MAX_FILE_BYTES: ${INGESTION_MAX_FILE_BYTES:-524288000}
    volumes:
      - adapter_ingestion_data:/var/lib/adapter-ingestion

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
      feishu-adapter:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      N8N_DOMAIN: ${N8N_DOMAIN:?Set N8N_DOMAIN in .env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env}
      RELAY_BASIC_AUTH_USER: ${RELAY_BASIC_AUTH_USER:?Set RELAY_BASIC_AUTH_USER in .env}
      RELAY_BASIC_AUTH_HASH: ${RELAY_BASIC_AUTH_HASH:?Set RELAY_BASIC_AUTH_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  postgres_data:
  adapter_ingestion_data:
  quant_data:
  caddy_data:
  caddy_config:
